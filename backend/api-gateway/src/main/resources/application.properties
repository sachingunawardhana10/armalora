spring.application.name=api-gateway
server.port=8080

# =========================================================
# Eureka Client
# =========================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true


# =========================================================
# Spring Cloud Gateway - Web MVC
# =========================================================

# Product Service
spring.cloud.gateway.server.webmvc.routes[0].id=product-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/products/**

# Inventory Service
spring.cloud.gateway.server.webmvc.routes[1].id=inventory-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/inventory/**

# User Service
spring.cloud.gateway.server.webmvc.routes[2].id=user-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/auth/**


# =========================================================
# Actuator
# =========================================================

management.endpoints.web.exposure.include=health,info,gateway

management.endpoint.gateway.access=read-only