server:
  port: 8086

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/armalora_user_db
    username: postgres
    password: YOUR_POSTGRES_PASSWORD
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka