<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        My Orders | Armalora
    </title>


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/navbar.css"
    >

    <link
        rel="stylesheet"
        href="css/footer.css"
    >

    <link
        rel="stylesheet"
        href="css/orders.css"
    >

</head>


<body>


    <!-- ========================================
         Navigation
         ======================================== -->

    <div id="navbar-container"></div>


    <!-- ========================================
         Orders Page
         ======================================== -->

    <main class="orders-page">


        <!-- Header -->

        <section class="orders-header">

            <p class="orders-eyebrow">
                Account
            </p>


            <h1 class="orders-title">
                My Orders
            </h1>


            <p class="orders-description">

                View your recent Armalora orders,
                order status and purchase details.

            </p>

        </section>


        <!-- ========================================
             Empty Orders
             ======================================== -->

        <section
            class="orders-empty"
            id="ordersEmpty"
            hidden
        >

            <div class="orders-empty-icon">
                —
            </div>


            <h2>
                No orders yet.
            </h2>


            <p>

                Your completed orders will appear
                here.

            </p>


            <a
                href="products.html"
                class="orders-button"
            >
                Start Shopping
            </a>

        </section>


        <!-- ========================================
             Orders List
             ======================================== -->

        <section
            class="orders-list"
            id="ordersList"
        >

        </section>


    </main>


    <!-- ========================================
         Footer
         ======================================== -->

    <div id="footer-container"></div>


    <!-- ========================================
         JavaScript
         ======================================== -->

    <script
        src="js/navbar.js"
    ></script>

    <script
        src="js/app.js"
    ></script>

    <script
        src="js/orders.js"
    ></script>


</body>

</html>
